[project]
name = "ki-bridge"
version = "0.1.0"
description = "Local MCP server: Claude delegates to Gemini, ChatGPT and the human"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "mcp[cli]>=2.3.0",
    "openai>=3.57.0",
]

[project.scripts]
ki-bridge = "ki_bridge:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
